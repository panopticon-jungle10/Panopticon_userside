services:
  fluent-bit:
    image: fluent/fluent-bit:2.2
    container_name: fluent-bit
    restart: unless-stopped
    volumes:
      - ./fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf
      - ./parsers.conf:/fluent-bit/etc/parsers.conf
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    env_file:
      - .env
    environment:
      PANOPTICON_LOG_HOST: ${PANOPTICON_LOG_HOST:-host.docker.internal}
      PANOPTICON_LOG_PORT: ${PANOPTICON_LOG_PORT:-3005}
      PANOPTICON_LOG_URI: ${PANOPTICON_LOG_URI:-/producer/v1/logs}

  postgres:
    image: postgres:16
    container_name: panopticon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-panopticon}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-panopticon}
      POSTGRES_DB: ${DATABASE_NAME:-panopticon}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  app:
    build:
      context: ../../backend
    container_name: panopticon-app
    depends_on:
      postgres:
        condition: service_started
      fluent-bit:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://host.docker.internal:3005/producer/v1/traces}
      SERVICE_NAME: ${SERVICE_NAME:-ecommerce-backend}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: docker.backend

  frontend:
    build:
      context: ../../frontend
    container_name: panopticon-frontend
    depends_on:
      app:
        condition: service_started
      fluent-bit:
        condition: service_started
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://app:3000}
      NEXT_PUBLIC_OTEL_EXPORTER_OTLP_URL: ${NEXT_PUBLIC_OTEL_EXPORTER_OTLP_URL:-http://localhost:3005/producer/v1/traces}
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    logging:
      driver: fluentd
      options:
        fluentd-address: fluent-bit:24224
        fluentd-async: "true"
        tag: docker.frontend

volumes:
  postgres-data:
