# OTEL Collector configuration for Panopticon
# Docker/ECS 환경에서 사용

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  otlphttp:
    endpoint: https://api.jungle-panopticon.cloud
    traces_endpoint: /producer/v1/traces
    timeout: 10s
    tls:
      insecure: false

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp]
