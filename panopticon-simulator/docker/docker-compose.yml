services:
  postgres:
    image: postgres:16
    container_name: panopticon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-panopticon}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-panopticon}
      POSTGRES_DB: ${DATABASE_NAME:-panopticon}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    backend:
    build:
      context: ../backend
    container_name: backend
    depends_on:
      - postgres
      - fluent-bit
    logging:
      driver: fluentd
      options:
        fluentd-address: 127.0.0.1:24224
        tag: docker.backend
        fluentd-async: "true"
        fluentd-retry-wait: "1s"
        fluentd-max-retries: "30"

  fluent-bit:
    image: fluent/fluent-bit:2.2
    container_name: panopticon-fluent-bit
    restart: unless-stopped
    volumes:
      - ../infra/docker:/fluent-bit/config:ro
    command: ["-c", "/fluent-bit/config/fluent-bit.conf"]
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      
  app:
    build:
      context: ../../backend
    container_name: panopticon-app
    depends_on:
      postgres:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: ${DATABASE_PORT:-5432}
    ports:
      - "${BACKEND_PORT:-3000}:3000"

  frontend:
    build:
      context: ../../frontend
    container_name: panopticon-frontend
    depends_on:
      app:
        condition: service_started
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://app:3000}
    ports:
      - "${FRONTEND_PORT:-3001}:3000"

volumes:
  postgres-data:
